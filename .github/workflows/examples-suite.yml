name: Examples Suite

on:
  push:
    paths-ignore:
      - 'docs/**'
    branches:
      - main

  pull_request:
    branches:
      - '**'

jobs:
  examples:
    name: ${{ matrix.os }} / ${{ matrix.python-version }} / examples
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Start podman socket
        if: runner.os == 'Linux'
        shell: bash
        run: |
          systemctl --user start podman.socket
          systemctl --user status podman.socket

      - name: Setup podman (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install podman podman-compose
          podman machine init
          podman machine start

      - name: Start test containers
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            export DOCKER_HOST="unix:///run/user/$(id -u)/podman/podman.sock"
          fi
          podman compose up -d
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pipx install poetry

      - name: Get poetry cache directory
        run: printf 'cache-dir=%s\n' "$(poetry config cache-dir)" >> "$GITHUB_OUTPUT"
        id: poetry-config
        shell: bash

      - name: Get current date
        run: printf 'date=%s\n' "$(date -I)" >> "$GITHUB_OUTPUT"
        id: get-date
        shell: bash

      - name: Cache Poetry
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.poetry-config.outputs.cache-dir }}/artifacts
            ${{ steps.poetry-config.outputs.cache-dir }}/cache
          key: poetry-${{ steps.get-date.outputs.date }}-${{ runner.os }}-${{ matrix.python-version }}-examples-${{ hashFiles('pyproject.toml', 'poetry.lock') }}
          restore-keys: |
            poetry-${{ steps.get-date.outputs.date }}-${{ runner.os }}-${{ matrix.python-version }}-examples-
            poetry-${{ steps.get-date.outputs.date }}-${{ runner.os }}-${{ matrix.python-version }}-
            poetry-${{ steps.get-date.outputs.date }}-${{ runner.os }}-
          enableCrossOsArchive: true

      - name: Install project and extras
        shell: bash
        run: poetry install --only main --all-extras

      - name: Run examples
        shell: bash
        env:
          GRAPHQL_ENDPOINT_WORLD_SERVER: "http://127.0.0.1:8080/v1/graphql"
          GRAPHQL_ENDPOINT_APOLLO_V2: "http://127.0.0.1:4000/graphql"
          GRAPHQL_ENDPOINT_STRAWBERRY: "http://127.0.0.1:5000/graphql"
        run: |
          shopt -s nullglob
          scripts=(examples/*.py)

          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "No example scripts found in examples/*.py"
            exit 1
          fi

          failures=0
          declare -a results=()

          # Helper to check if server is available
          check_server() {
            local url=$1
            curl -s -o /dev/null -w "%{http_code}" "$url" --connect-timeout 2 | grep -qE "200|400|405"
          }

          for script in "${scripts[@]}"; do
            echo "Running ${script}..."

            # Basic check to see if we should skip based on server availability
            # This is a bit naive but helps avoids failures on non-linux where we know servers are missing
            skip=0
            # Read script content to guess which server it needs
            content=$(cat "$script")
            if [[ "$content" == *"8080"* ]]; then
              check_server "$GRAPHQL_ENDPOINT_WORLD_SERVER" || skip=1
            elif [[ "$content" == *"4000"* ]]; then
              check_server "$GRAPHQL_ENDPOINT_APOLLO_V2" || skip=1
            elif [[ "$content" == *"5000"* ]] || [[ "$content" == *"localhost:5000"* ]]; then
              check_server "$GRAPHQL_ENDPOINT_STRAWBERRY" || skip=1
            fi

            if [[ $skip -eq 1 ]]; then
              echo "Skipping ${script} as required server is not available."
              results+=("${script}|SKIP")
              continue
            fi

            if poetry run python "${script}"; then
              results+=("${script}|PASS")
            else
              exit_code=$?
              results+=("${script}|FAIL (${exit_code})")
              failures=$((failures + 1))
            fi
          done

          echo
          printf "%-45s | %-12s\n" "Script" "Result"
          printf -- "%.0s-" {1..62}
          echo
          for result in "${results[@]}"; do
            script_name="${result%%|*}"
            status="${result#*|}"
            printf "%-45s | %-12s\n" "${script_name}" "${status}"
          done

          {
            echo "### Examples execution results"
            echo
            echo "| Script | Result |"
            echo "| --- | --- |"
            for result in "${results[@]}"; do
              script_name="${result%%|*}"
              status="${result#*|}"
              echo "| \`${script_name}\` | ${status} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ${failures} -gt 0 ]]; then
            echo "${failures} example script(s) failed"
            exit 1
          fi

      - name: Stop test containers
        if: always()
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            export DOCKER_HOST="unix:///run/user/$(id -u)/podman/podman.sock"
          fi
          podman compose down --remove-orphans
