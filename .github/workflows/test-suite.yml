name: Test Suite

on:
  push:
    paths-ignore:
      - 'docs/**'
    branches:
      - main

  pull_request:
    branches:
      - '**'

jobs:
  tests:
    name: ${{ matrix.os }} / ${{ matrix.python-version }} / ${{ matrix.transport }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [Ubuntu]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        transport: ["aiohttp", "httpx", "both"]
    services:
      postgres:
        image: docker.io/postgres:9.6-alpine
        env:
          POSTGRES_PASSWORD: hasura
          POSTGRES_USER: hasura
          POSTGRES_DB: hasura
        ports:
          - 5432:5432
      hasura:
        image: quay.io/twyla-ai/hasura-world-db:latest
        env:
          HASURA_GRAPHQL_DATABASE_URL: postgres://hasura:hasura@postgres:5432/hasura
          HASURA_GRAPHQL_ADMIN_SECRET: secret
        ports:
          - 8080:8080
        options: --restart on-failure
    steps:
      - uses: actions/checkout@v4

      - name: Start podman socket
        shell: bash
        run: |
          systemctl --user start podman.socket
          systemctl --user status podman.socket

      - name: Start test container (apollo-server-v2)
        shell: bash
        run: |
          export DOCKER_HOST="unix:///run/user/$(id -u)/podman/podman.sock"
          podman compose up -d apollo-server-v2

      - name: Install poetry
        run: pipx install poetry

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Setup test environment
        shell: bash
        run: |
          if [ "${{ matrix.transport }}" == "aiohttp" ]; then
            poetry install --extras aiohttp
          elif [ "${{ matrix.transport }}" == "httpx" ]; then
            poetry install --extras httpx
          else
            poetry install --extras all
          fi

      - name: Wait for hasura
        shell: bash
        run: |
          timeout 300s bash -c \
            'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' 127.0.0.1:${{ job.services.hasura.ports[8080] }}/healthz)" != "200" ]]; do sleep 5; done' \
          || false

      - name: Execute test suite
        shell: bash
        run: |
          poetry run pytest \
            --server-world-db="http://127.0.0.1:${{ job.services.hasura.ports[8080] }}/v1/graphql" \
            --server-apollo-v2="http://127.0.0.1:4000/graphql"
