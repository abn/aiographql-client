[build-system]
requires = [
    "poetry-core>=2.0.0,<3.0.0",
]
build-backend = "poetry.core.masonry.api"

[project]
name = "aiographql-client"
version = "1.2.0a0"
description = "An asyncio GraphQL client built on top of aiohttp and graphql-core-next"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = [
    "aiohttp",
    "asyncio",
    "client",
    "graphql",
    "graphql-core",
    "graphql-core-next",
]
dynamic = [
    "classifiers",
]
dependencies = [
    "cafeteria-asyncio >=0.3,<0.4",
    "aiohttp >=3.5,<4.0",
    "graphql-core >=3.0,<4.0",
    "ujson >=2",
]

[[project.authors]]
name = "Arun Neelicattu"
email = "arun.neelicattu@gmail.com"

[project.urls]
repository = "https://github.com/abn/aiographql-client"

[tool.poetry]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
]
requires-poetry = ">=2.0"


[[tool.poetry.packages]]
include = "aiographql"
from = "src"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
src_paths = [
    "src",
    "test",
]
known_first_party = "aiographql"

[tool.pytest.ini_options]
minversion = "6.0"
asyncio_mode = "auto"
addopts = "--cov --cov-append --cov-report=term"
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    "ignore:Unclosed client session:ResourceWarning",
]

[tool.coverage.run]
branch = true
parallel = true
data_file = ".coverage/data"
source = [
    "aiographql.client",
]
omit = [
    "tests/*",
]

[tool.coverage.paths]
source = [
    "src",
]

[tool.coverage.report]
skip_empty = true
ignore_errors = true

# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",

    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = ".coverage/html"

[tool.coverage.xml]
output = ".coverage/coverage.xml"

[tool.coverage.json]
output = ".coverage/coverage.json"

[tool.mypy]
files = "src, tests"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
strict = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
exclude = [
    "tests/fixtures",
    "tests/masonry/builders/fixtures",
    "tests/utils/fixtures",
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
pytest-mock = "^3.15.1"
mypy = "^1.19.1"
types-ujson = "^5.10.0"

[tool.poetry.group.dev.dependencies.coverage]
version = "^7.4"
extras = [
    "toml",
]
