[build-system]
requires = [
    "poetry-core>=2.0.0,<3.0.0",
]
build-backend = "poetry.core.masonry.api"

[project]
name = "aiographql-client"
version = "1.2.0a0"
description = "An asyncio GraphQL client built on top of aiohttp and graphql-core-next"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = [
    "aiohttp",
    "asyncio",
    "client",
    "graphql",
    "graphql-core",
    "graphql-core-next",
]
dynamic = [
    "classifiers",
]
dependencies = [
    "cafeteria-asyncio >=0.3,<0.4",
    "graphql-core >=3.0,<4.0",
    "orjson (>=3.11.7,<4.0.0)",
]

[[project.authors]]
name = "Arun Neelicattu"
email = "arun.neelicattu@gmail.com"

[project.urls]
repository = "https://github.com/abn/aiographql-client"

[project.optional-dependencies]
pydantic = ["pydantic>=2.0"]
aiohttp = ["aiohttp >=3.5,<4.0"]
httpx = ["httpx >=0.24.0,<1.0.0"]
websockets = ["websockets>=13.0"]
subscriptions = ["aiohttp >=3.5,<4.0"]
all = [
    "aiohttp >=3.5,<4.0",
    "pydantic>=2.0",
]

[tool.poetry]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
]
requires-poetry = ">=2.0"


[[tool.poetry.packages]]
include = "aiographql"
from = "src"

[tool.ruff]
extend-exclude = [
    "docs/*",
]
fix = true
line-length = 88

[tool.ruff.lint]
extend-select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ERA", # flake8-eradicate/eradicate
    "I",   # isort
    "N",   # pep8-naming
    "PIE", # flake8-pie
    "PGH", # pygrep
    "RUF", # ruff checks
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "TC",  # flake8-type-checking
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
]
ignore = [
    "B904", # use 'raise ... from err'
    "B905", # use explicit 'strict=' parameter with 'zip()'
    "N818", # exception name should be named with an Error suffix
    "N815", # variable in class scope should not be mixedCase
]
extend-safe-fixes = [
    "TC",  # move import from and to TYPE_CHECKING blocks
]
unfixable = [
    "ERA", # do not autoremove commented out code
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = true
lines-between-types = 1
lines-after-imports = 2
known-first-party = ["aiographql"]
required-imports = ["from __future__ import annotations"]

[tool.pytest.ini_options]
minversion = "6.0"
asyncio_mode = "auto"
addopts = "--cov --cov-append --cov-report=term"
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    "ignore:Unclosed client session:ResourceWarning",
]

[tool.coverage.run]
branch = true
parallel = true
data_file = ".coverage/data"
source = [
    "aiographql.client",
]
omit = [
    "tests/*",
]

[tool.coverage.paths]
source = [
    "src",
]

[tool.coverage.report]
skip_empty = true
ignore_errors = true

# Regexes for lines to exclude from consideration
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",

    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = ".coverage/html"

[tool.coverage.xml]
output = ".coverage/coverage.xml"

[tool.coverage.json]
output = ".coverage/coverage.json"

[tool.mypy]
files = "src, tests"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
strict = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
exclude = [
    "tests/fixtures",
    "tests/masonry/builders/fixtures",
    "tests/utils/fixtures",
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
pytest-mock = "^3.15.1"
mypy = "^1.19.1"
types-orjson = "^3.6.2"
pydantic = ">=2.0"
ruff = "^0.15.7"
httpx = "^0.28.1"
respx = "^0.22.0"
pytest-timeout = "^2.4.0"

[tool.poetry.group.dev.dependencies.coverage]
version = "^7.4"
extras = [
    "toml",
]
