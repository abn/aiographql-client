# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

sphinx:
  configuration: docs/conf.py

# `htmlzip` excluded: built with the singlehtml builder, which the
# Shibuya theme cannot render.
formats:
  - pdf
  - epub

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_install:
      # https://docs.readthedocs.com/platform/stable/build-customization.html#install-dependencies-with-poetry
      - pip install poetry
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH poetry install --only=docs,main --all-extras
